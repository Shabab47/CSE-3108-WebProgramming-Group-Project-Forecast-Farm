<!DOCTYPE html>
<html lang="en" data-page="game">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Forecast Farm</title>
    <meta name="description" content="A 2D farming game driven by real weather at your own location." />

    <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/themes.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/navbar.css" />
    <link rel="stylesheet" href="css/report-bug.css" />
    <link rel="stylesheet" href="css/weather.css" />
    <link rel="stylesheet" href="css/scene.css" />
    <link rel="stylesheet" href="css/env-card.css" />
    <link rel="stylesheet" href="css/farm-dialog.css" />
    <link rel="stylesheet" href="css/crop-picker.css" />
    <link rel="stylesheet" href="css/shop.css" />
    <link rel="stylesheet" href="css/settings.css" />
    <link rel="stylesheet" href="css/sidebar.css" />
    <link rel="stylesheet" href="css/phone.css" />
    <link rel="stylesheet" href="css/phone-panels.css" />
    <link rel="stylesheet" href="css/phone-weather.css" />
    <link rel="stylesheet" href="css/phone-forecast.css" />
  </head>

  <body>
    <!-- Sync indicator mount point. A fixed corner chip, so it can never shift
         the layout — see ISS-076 and js/connection.js. -->
    <div id="sync-indicator"></div>

    <!-- The painted yard behind the whole page, wide screens only. `hidden` from a
         screen reader: it is scenery, and the navbar names the page already. The
         image itself is applied from `js/config/assets.js` -- see `FARM_BG` -- and the
         layer is `display: none` below 901px, so a phone never fetches it. -->
    <div class="app__scene" aria-hidden="true"></div>

    <!-- The farm itself. Replaced wholesale by the blocked screen when there is no
         connection and no session, because RLS means there is no farm to show. -->
    <div class="app" id="app">
      <header class="app__top" id="top-bar"></header>

      <aside class="app__sidebar" id="sidebar">
        <div id="season-card"></div>
        <div class="app__menu">
          <div id="shop-launch"></div>
          <div id="almanac-launch"></div>
          <div id="inventory-launch"></div>
        </div>
      </aside>

      <main class="app__centre">
        <section class="board" id="forecast-board">
          <div id="location-bar"></div>
          <div id="forecast-card"></div>
        </section>

        <section class="card" id="farm-view"></section>
      </main>

      <aside class="app__rail" id="right-rail"></aside>
    </div>

    <!-- The seed picker's host: a viewport-level overlay, a body child beside the toast
         stack rather than anything inside `.app`.

         Two reasons, and both are load-bearing:
           - `mountFarmView()` clears `#farm-view` wholesale on every render, so a picker
             mounted inside the field was torn down by the 1 Hz growth tick and a player
             had under a second to choose a seed. See ISS-085.
           - It centres on the *whole screen*, not on the centre column, so it cannot live
             inside `.app` at all: `.app` is `overflow: hidden` and `height: 100dvh`, so
             anything anchored inside it is confined to the game shell and reads as
             off-centre on a wide monitor. -->
    <div id="farm-picker"></div>

    <div class="toast-stack" id="toast-stack" aria-live="polite"></div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
