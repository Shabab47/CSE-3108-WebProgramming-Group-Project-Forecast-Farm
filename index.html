<!DOCTYPE html>
<html lang="en" data-page="game">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Forecast Farm</title>
    <meta name="description" content="A 2D farming game driven by real weather at your own location." />

    <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/themes.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/weather.css" />
    <link rel="stylesheet" href="css/farm.css" />
    <link rel="stylesheet" href="css/shop.css" />
    <link rel="stylesheet" href="css/settings.css" />
  </head>

  <body>
    <div class="app">
      <header class="app__top" id="top-bar"></header>

      <aside class="app__sidebar" id="sidebar">
        <div id="shop-launch"></div>
        <div id="settings-launch"></div>
      </aside>

      <main class="app__centre">
        <section class="card">
          <div id="location-bar"></div>
          <div id="forecast-card"></div>
        </section>

        <section class="card" id="farm-view"></section>
      </main>

      <aside class="app__rail" id="right-rail">
        <div id="save-panel"></div>
      </aside>
    </div>

    <div class="toast-stack" id="toast-stack" aria-live="polite"></div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
